name: Update Job Data

# Wann der Workflow läuft
on:
  # Manuell triggern (z.B. über Streamlit-Button oder GitHub-UI)
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Schritt 1 (Collect) überspringen — nur cleaning + extract"
        type: boolean
        default: false

  # Automatisch jede Nacht um 3 Uhr UTC (= 4 Uhr in Deutschland)
  schedule:
    - cron: "0 3 * * *"

jobs:
  update-data:
    name: Sammle und verarbeite Job-Daten
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect Jobs (Multi-Source)
        if: ${{ github.event.inputs.skip_collect != 'true' }}
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          echo "::group::Multi-Source Job Collection"
          python -m src.collect_jobs
          echo "::endgroup::"

      - name: Clean & Feature-Engineering
        run: |
          echo "::group::Data Cleaning"
          python -m src.clean_jobs
          echo "::endgroup::"

      - name: Extract Skills
        run: |
          echo "::group::Skill Extraction"
          python -m src.extract_skills
          echo "::endgroup::"

      - name: Load to PostgreSQL (Neon)
        env:
          USE_POSTGRES: "true"
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "::group::Load to PostgreSQL"
          python -m src.load_to_postgres --truncate
          echo "::endgroup::"

      - name: Summary
        run: |
          echo "## ✅ Pipeline abgeschlossen" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Daten wurden erfolgreich aktualisiert und in PostgreSQL geladen." >> $GITHUB_STEP_SUMMARY
          echo "Die Streamlit-App zeigt nach Cache-Reload die neuen Daten." >> $GITHUB_STEP_SUMMARY
